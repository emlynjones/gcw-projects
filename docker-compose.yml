services:
  gcw-projects:
    build: .
    container_name: gcw-projects
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file: .env
    environment:
      DATABASE_URL: "file:/data/gcw-projects.db"
    # Use explicit resolvers because the relocated host's Docker DNS cannot
    # currently resolve external APIs (Xero reports EAI_AGAIN from the app).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /data-drive/docker/gcw-projects/data:/data
